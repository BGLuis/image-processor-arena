services:
  # ---------------------------------------------------------------------------
  # Servidor Go Puro (Porta 8080)
  # ---------------------------------------------------------------------------
  go-server:
    build:
      context: .
      dockerfile: docker/go.Dockerfile
    image: arena-go:latest
    container_name: arena-go-server
    environment:
      - PORT=8080
      - GOMAXPROCS=6
      - GOGC=100
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:8080/health || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 3s
    # Perfil Dev: montagem de volume para desenvolvimento iterativo
    profiles:
      - dev
      - bench

  # ---------------------------------------------------------------------------
  # Servidor Rust Puro (Porta 8081)
  # ---------------------------------------------------------------------------
  rust-server:
    build:
      context: .
      dockerfile: docker/rust.Dockerfile
    image: arena-rust:latest
    container_name: arena-rust-server
    environment:
      - PORT=8081
      - RUST_LOG=info
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:8081/health || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 3s
    profiles:
      - dev
      - bench

  # ---------------------------------------------------------------------------
  # Harness de Validação e Benchmark
  # ---------------------------------------------------------------------------
  harness:
    build:
      context: .
      dockerfile: docker/harness.Dockerfile
    image: arena-harness:latest
    container_name: arena-harness
    volumes:
      - ./harness:/arena/harness
      - ./docs:/arena/docs
      - ./results:/arena/results
    depends_on:
      go-server:
        condition: service_healthy
      rust-server:
        condition: service_healthy
    profiles:
      - dev
      - bench

# -----------------------------------------------------------------------------
# Configurações de Recursos e Isolamento para Benchmarking (Perfil 'bench')
# P-Cores (0-11) para servidores; E-Cores (12-15) para gerador de carga (oha)
# -----------------------------------------------------------------------------
  go-server-bench:
    extends:
      service: go-server
    container_name: arena-go-bench
    deploy:
      resources:
        limits:
          cpus: "6.0"
          memory: 3G
    cpuset: "0-11"
    tmpfs:
      - /tmp:rw,size=512M
    profiles:
      - bench-isolated

  rust-server-bench:
    extends:
      service: rust-server
    container_name: arena-rust-bench
    deploy:
      resources:
        limits:
          cpus: "6.0"
          memory: 3G
    cpuset: "0-11"
    tmpfs:
      - /tmp:rw,size=512M
    profiles:
      - bench-isolated

  harness-bench:
    extends:
      service: harness
    container_name: arena-harness-bench
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 2G
    cpuset: "12-15"
    tmpfs:
      - /arena/ramdisk:rw,size=1024M
    profiles:
      - bench-isolated
