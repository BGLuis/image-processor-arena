services:
  # ---------------------------------------------------------------------------
  # Servidor Go Puro (Porta 8080)
  # ---------------------------------------------------------------------------
  go-server:
    build:
      context: .
      dockerfile: docker/go.Dockerfile
    image: arena-go:latest
    container_name: arena-go-server
    environment:
      - PORT=8080
      - GOMAXPROCS=${ARENA_GOMAXPROCS:-6}
      - GOGC=100
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:8080/health || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 3s
    # Perfil Dev: montagem de volume para desenvolvimento iterativo
    profiles:
      - dev
      - bench

  # ---------------------------------------------------------------------------
  # Servidor Rust Puro (Porta 8081)
  # ---------------------------------------------------------------------------
  rust-server:
    build:
      context: .
      dockerfile: docker/rust.Dockerfile
    image: arena-rust:latest
    container_name: arena-rust-server
    environment:
      - PORT=8081
      - RUST_LOG=info
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f http://localhost:8081/health || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 3s
    profiles:
      - dev
      - bench

  # ---------------------------------------------------------------------------
  # Harness de Validação e Benchmark
  # ---------------------------------------------------------------------------
  harness:
    build:
      context: .
      dockerfile: docker/harness.Dockerfile
    image: arena-harness:latest
    container_name: arena-harness
    # Com ./results montado do host, rode com o uid/gid do dono dele: ARENA_UID=$(id -u) ARENA_GID=$(id -g)
    user: "${ARENA_UID:-10001}:${ARENA_GID:-10001}"
    volumes:
      - ./harness:/arena/harness
      - ./docs:/arena/docs
      - ./results:/arena/results
    depends_on:
      go-server:
        condition: service_healthy
      rust-server:
        condition: service_healthy
    command: ["python3", "harness/benchmark_arena.py", "--mode", "http", "--go-url", "http://go-server:8080/run", "--rust-url", "http://rust-server:8081/run"]
    profiles:
      - dev
      - bench

# -----------------------------------------------------------------------------
# Configurações de Recursos e Isolamento para Benchmarking (Perfil 'bench-isolated')
#
# O perfil 'bench' roda os servidores e o harness SEM limites de CPU nem memória. O isolamento está
# neste perfil: `docker compose --profile bench-isolated up --build`. Os servidores ficam num conjunto
# de CPUs e o harness (e o gerador de carga) em outro, para um não disputar núcleo com o outro.
#
# Os valores padrão (CPUs 0-11 para os servidores, 12-15 para o harness) são de uma máquina de 16 CPUs
# lógicas com 12 núcleos de desempenho; NÃO servem para qualquer hardware. Ajuste com variáveis de
# ambiente (ou um arquivo .env), de acordo com `lscpu -e`:
#
#   ARENA_SERVER_CPUSET   CPUs dos servidores        (padrão 0-11)
#   ARENA_SERVER_CPUS     limite de CPU de cada um   (padrão 6.0)
#   ARENA_SERVER_MEMORY   limite de memória de cada  (padrão 3G)
#   ARENA_HARNESS_CPUSET  CPUs do harness e do oha   (padrão 12-15)
#   ARENA_HARNESS_CPUS    limite de CPU do harness   (padrão 4.0)
#   ARENA_HARNESS_MEMORY  limite de memória          (padrão 2G)
#
# Os dois conjuntos de CPUs não devem se sobrepor.
# -----------------------------------------------------------------------------
  go-server-bench:
    extends:
      service: go-server
    container_name: arena-go-bench
    deploy:
      resources:
        limits:
          cpus: "${ARENA_SERVER_CPUS:-6.0}"
          memory: ${ARENA_SERVER_MEMORY:-3G}
    cpuset: "${ARENA_SERVER_CPUSET:-0-11}"
    tmpfs:
      - /tmp:rw,size=512M
    profiles:
      - bench-isolated

  rust-server-bench:
    extends:
      service: rust-server
    container_name: arena-rust-bench
    deploy:
      resources:
        limits:
          cpus: "${ARENA_SERVER_CPUS:-6.0}"
          memory: ${ARENA_SERVER_MEMORY:-3G}
    cpuset: "${ARENA_SERVER_CPUSET:-0-11}"
    tmpfs:
      - /tmp:rw,size=512M
    profiles:
      - bench-isolated

  harness-bench:
    build:
      context: .
      dockerfile: docker/harness.Dockerfile
    image: arena-harness:latest
    container_name: arena-harness-bench
    user: "${ARENA_UID:-10001}:${ARENA_GID:-10001}"
    volumes:
      - ./harness:/arena/harness
      - ./docs:/arena/docs
      - ./results:/arena/results
    depends_on:
      go-server-bench:
        condition: service_healthy
      rust-server-bench:
        condition: service_healthy
    command: ["python3", "harness/benchmark_arena.py", "--mode", "http", "--go-url", "http://go-server-bench:8080/run", "--rust-url", "http://rust-server-bench:8081/run"]
    deploy:
      resources:
        limits:
          cpus: "${ARENA_HARNESS_CPUS:-4.0}"
          memory: ${ARENA_HARNESS_MEMORY:-2G}
    cpuset: "${ARENA_HARNESS_CPUSET:-12-15}"
    tmpfs:
      - /arena/ramdisk:rw,size=1024M
    profiles:
      - bench-isolated
