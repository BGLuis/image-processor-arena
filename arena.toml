[arena]
name = "image-processor-arena"
version = "0.1.0"
description = "Pure Go vs Pure Rust Image Processing Arena under high load"

[codecs.go]
png = "image/png (stdlib)"
jpeg = "image/jpeg (stdlib, baseline 4:2:0)"
webp_lossy = "github.com/deepteams/webp"
webp_lossless = "github.com/KarpelesLab/gowebp"
webp_decode_alt = "golang.org/x/image/webp"
avif_lossy = "github.com/gen2brain/gav1d/avif"
avif_decode_alt = "github.com/KarpelesLab/goavif"
jxl = "github.com/gen2brain/jxl"

# Variantes de compilação e execução Go:
# 1. go:portable:1.27:noasm (Tier 1: Portável)
#    - Compilado com CGO_ENABLED=0 e -tags "noasm portable".
#    - Isola deepteams/webp; usa gowebp puro para WebP (lossy e lossless) e ximage/gowebp no decode.
#    - 0 arquivos assembly (.s) em dependências externas.
# 2. go:accelerated:1.27:padrao (Tier 2: Acelerado - Padrão)
#    - Compilado com CGO_ENABLED=0 sem tags restritivas.
#    - Utiliza rotinas assembly/SIMD de deepteams/webp, gav1d e gen2brain/jxl.
# 3. go:accelerated:1.27:pgo (Tier 2: Acelerado com PGO)
#    - Compilado com CGO_ENABLED=0 e -pgo=auto (perfis cmd/server/default.pgo e cmd/batch/default.pgo gerados por cmd/pgo_gen).
#    - Otimização guiada por perfil sobre o corpus representativo da Arena.
# 4. go:accelerated:1.27:alt-pure (Tier 2: Bibliotecas Puras Alternativas)
#    - Selecionáveis via parâmetro ?impl= / from_impl / to_impl (e flag --impl no batch):
#      * WebP: deepteams (lossy), gowebp (lossy e lossless), ximage (decode golang.org/x/image/webp)
#      * AVIF: gav1d (encode/decode), goavif (decode github.com/KarpelesLab/goavif)
#      * Header X-Arena-Impl informa a implementação executada.
# 5. go:hybrid:1.27:cgo (Tier 3: Híbrido CGO)
#    - Compilado com CGO_ENABLED=1 e -tags hybrid.
#    - Bindings CGO nativos para libturbojpeg e libwebp do sistema; adaptadores hybrid/cgo para todos os 5 formatos.
#
# Limitações conhecidas:
# - AVIF lossless não é suportado pelo gav1d (retorna 400 ErrUnsupportedFormat).
# - WebP animado é rejeitado (400) pelo decodificador da Arena.
# - JPEG suporta qualidade 1..100 com subamostragem 4:2:0 baseline.

[codecs.rust]
png = "png 0.18.1"
jpeg_encode = "jpeg-encoder 0.7.1"
jpeg_decode = "zune-jpeg 0.5.16-rc2"
webp_lossy_encode = "zenwebp 0.4.4"
webp_lossless_encode = "image-webp 0.2.4"
webp_decode = "image-webp 0.2.4"
avif_lossy_encode = "ravif 0.13.0 (no asm)"
avif_decode = "zenavif 0.1.6 / rav1d 1.1.0 (no asm)"
jxl_encode = "jxl-encoder 0.3.1"
jxl_decode = "jxl-oxide 0.12.6"

[codecs.cpp]
png = "libpng 1.6 / lodepng (portable)"
jpeg = "libturbojpeg 3.x"
webp = "libwebp 1.5.0"
avif = "pillow / dav1d"
jxl = "libjxl 0.11.1"

[operations.go]
resize = ["golang.org/x/image/draw", "github.com/disintegration/imaging"]
filter = ["github.com/disintegration/imaging"]
seam_carving = ["github.com/esimov/caire"]

[operations.rust]
resize = ["fast_image_resize", "image"]
filter = ["imageproc"]
seam_carving = []

[ops]
routes = ["analyze", "encode", "decode", "transcode", "resize", "filter", "seam_carving"]
resize_filters = ["lanczos3", "catmullrom", "bilinear", "nearest"]
resize_default_filter = "lanczos3"
filter_types = ["blur", "sharpen", "grayscale", "invert", "edge"]
filter_default = "blur"

[purity]
go_cgo_enabled = 0
go_forbidden = ["github.com/ebitengine/purego", "github.com/tetratelabs/wazero"]
rust_banned_crates = ["cc", "cmake", "bindgen", "nasm-rs", "pkg-config"]

[tiers]
default = "accelerated"

[tiers.portable]
name = "Tier 1: Portável"
description = "Código 100% puro e portável sem código assembly (.s) em dependências externas nem CGO/FFI"
go_tags = ["noasm", "portable"]
rust_features = []
cgo_enabled = 0

[tiers.accelerated]
name = "Tier 2: Acelerado"
description = "Código 100% puro (sem CGO/FFI), permitindo aceleração SIMD/assembly nativo do ecossistema"
go_tags = []
rust_features = []
cgo_enabled = 0

[tiers.hybrid]
name = "Tier 3: Híbrido"
description = "Extensões com bindings CGO/FFI para bibliotecas de sistema C/C++"
go_tags = ["hybrid"]
rust_features = ["hybrid"]
cgo_enabled = 1

[params]
# Single parameter contract for both engines, servers and batch CLIs. Go and Rust tests read
# these values; the benchmark harness sends them. Out-of-range or non-numeric values are rejected
# (HTTP 400 / batch exit 1), never clamped. An omitted or empty value selects the default.
mode_default = "lossy"
q_default = 75
q_min = 1
q_max = 100
effort_default = 4
effort_min = 1
effort_max = 10
out_of_range = "reject"
# effort 1..10 -> 0..6 (rounded linear). webp lossy method = step, jxl effort = step + 1.
effort_step = [0, 1, 1, 2, 3, 3, 4, 5, 5, 6]
impl_param = "impl"
from_impl_param = "from_impl"
to_impl_param = "to_impl"

[params.mapping]
# Higher effort always means slower and smaller. Native scales are matched by position, not by
# identical internals: the same effort is the closest tier, not the same algorithm.
png = "q: none (always lossless, mode ignored). effort: 1-2 fastest deflate, 3-6 default, 7-10 best (go BestSpeed/Default/BestCompression, rust Fast/Balanced/High)."
jpeg = "q: native quality 1..100, both use the Annex K tables with the libjpeg scale and 4:2:0 chroma (rust forces 4:2:0, its default switches to 4:4:4 at q>=90). effort: none, ignored. mode ignored."
webp_lossy = "q: native quality 1..100 (float). effort: method = effort_step[effort-1] (0..6, native range of both zenwebp and deepteams/webp)."
webp_lossless = "q: none. effort: none. Neither gowebp nor image-webp expose a compression knob."
avif_lossy = "q: AV1 base_q_idx = (100-q)*255/100, gav1d's native mapping; ravif uses a different curve, so rust passes the ravif quality that yields the same index. effort: speed = 11-effort (1..10, inverted because AVIF speed 10 is fastest; 0 is not used because ravif starts at 1). Not normalizable: gav1d always writes 4:2:0 and ravif always 4:4:4."
jxl_lossy = "q: Butteraugli distance = 0.1+(100-q)*0.09 for q>=30, else 53/3000*q^2-23/20*q+25 (gen2brain/jxl native mapping; jxl-encoder's own quality_to_distance differs, so rust computes the distance itself). effort: jxl effort = effort_step[effort-1]+1 (1..7, the native range of gen2brain/jxl; rust is capped to it)."
jxl_lossless = "q: none. effort: jxl effort = effort_step[effort-1]+1."

[limits]
# Request limits enforced identically by both servers; the Go and Rust tests read these values.
# Override at run time with ARENA_MAX_BODY_BYTES and ARENA_MAX_PIXELS (positive integers).
# A body above max_body_bytes is answered with HTTP 413. A PAM whose WIDTH*HEIGHT exceeds
# max_pixels, or whose declared raster cannot fit in the body, is answered with HTTP 400 before
# any raster is allocated. The batch CLIs apply max_pixels too.
max_body_bytes = 268435456
max_pixels = 40000000

[benchmarks]
server_go_port = 8080
server_rust_port = 8081
server_cpp_port = 8082
# Referência da máquina em que os resultados publicados foram coletados (16 CPUs lógicas). No Docker
# o isolamento é configurável por ARENA_SERVER_CPUSET / ARENA_HARNESS_CPUSET (ver docker-compose.yml).
cpuset_servers = "0-11"
cpuset_harness = "12-15"
memory_limit = "3g"
tmpfs_path = "/arena/ramdisk"
