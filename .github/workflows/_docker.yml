name: Docker validation

on:
  workflow_call:

permissions: {}

jobs:
  docker-validation:
    name: "Docker ${{ matrix.name }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "compose dev"
            profiles: "dev"
          - name: "compose bench"
            profiles: "bench bench-isolated"
          - name: "rust test stage"
            dockerfile: docker/rust.Dockerfile
            scope: rust-test
          - name: "go test stage"
            dockerfile: docker/go.Dockerfile
            scope: go-test
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Validate docker-compose configuration
        if: matrix.profiles
        run: |
          docker compose config --quiet

      - name: Build Docker compose profiles
        if: matrix.profiles
        env:
          PROFILES: ${{ matrix.profiles }}
        run: |
          args=()
          for profile in ${PROFILES}; do args+=(--profile "${profile}"); done
          docker compose "${args[@]}" build

      # Os estágios `test` rodam a suíte completa e a verificação de pureza dentro de cada imagem
      # (issue #12: o build Docker do Rust nunca tinha sido exercitado no CI).
      - name: Run the ${{ matrix.name }} in Docker
        if: matrix.dockerfile
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: test
          push: false
          cache-from: type=gha,scope=${{ matrix.scope }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,scope={0},mode=max', matrix.scope) || '' }}
