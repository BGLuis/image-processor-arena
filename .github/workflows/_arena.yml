name: Arena

on:
  workflow_call:
    inputs:
      go_id: {required: true, type: string}
      go_bin_dir: {required: true, type: string}
      rust_id: {required: true, type: string}
      rust_bin_dir: {required: true, type: string}

permissions: {}

env:
  PYTHON_VERSION: '3.12'

jobs:
  cross-validation:
    name: "Mathematical Cross-Validation"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read  # checkout
    env:
      GO_BIN: ${{ inputs.go_bin_dir }}
      RUST_BIN: ${{ inputs.rust_bin_dir }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: harness/requirements.txt

      - name: Download Go batch artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.go_id }}-bin
          path: ${{ inputs.go_bin_dir }}

      - name: Download Rust batch artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.rust_id }}-bin
          path: ${{ inputs.rust_bin_dir }}

      - name: Set binary permissions
        run: |
          chmod +x "${GO_BIN}/arena-batch"
          chmod +x "${RUST_BIN}/arena-batch"

      - name: Verify Python self-oracle ground truth
        run: |
          python3 harness/verify_cross.py --mode self

      - name: Run cross-validation against Go and Rust engines
        run: |
          python3 harness/verify_cross.py --mode batch --target all

  arena-benchmark:
    name: "Arena Benchmark & Podium"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read  # checkout
    env:
      GO_BIN: ${{ inputs.go_bin_dir }}
      RUST_BIN: ${{ inputs.rust_bin_dir }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: harness/requirements.txt

      - name: Install reference decoders (Pillow + libjxl plugin)
        run: |
          python3 -m pip install -r harness/requirements.txt

      - name: Download Go Server binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.go_id }}-bin
          path: ${{ inputs.go_bin_dir }}

      - name: Download Rust Server binary artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.rust_id }}-bin
          path: ${{ inputs.rust_bin_dir }}

      - name: Set binary permissions
        run: |
          chmod +x "${GO_BIN}/arena-server"
          chmod +x "${RUST_BIN}/arena-server"

      - name: Start Go and Rust servers in background
        run: |
          PORT=8080 "${GO_BIN}/arena-server" &
          PORT=8081 "${RUST_BIN}/arena-server" &
          echo "[*] Aguardando inicialização dos servidores..."
          for port in 8080 8081; do
            online=false
            for i in $(seq 1 30); do
              if curl -s -f "http://localhost:${port}/health" > /dev/null; then
                echo "[+] Servidor na porta ${port} está online."
                online=true
                break
              fi
              sleep 0.5
            done
            if [ "$online" != "true" ]; then
              echo "[-] ERRO: Servidor na porta ${port} não respondeu ao healthcheck."
              exit 1
            fi
          done

      - name: Run HTTP Arena Benchmark Suite
        run: |
          mkdir -p results/ci
          python3 harness/benchmark_arena.py \
            --mode http \
            --go-url http://localhost:8080/run \
            --rust-url http://localhost:8081/run \
            --iterations 5 \
            --warmup 1 \
            --output-dir results/ci

      - name: Publish Podium to Job Summary
        if: always()
        run: |
          if [ -f results/ci/PODIUM.md ]; then
            echo "## 🏆 Pódio da Arena (Execução no CI)" >> "$GITHUB_STEP_SUMMARY"
            cat results/ci/PODIUM.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Benchmark Results Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arena-benchmark-ci-results
          path: results/ci/
          retention-days: 14
