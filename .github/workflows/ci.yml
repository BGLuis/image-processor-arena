name: CI

# Orquestrador: decide o que mudou (scripts/ci-plan.sh + .github/ci-variants.json) e chama um workflow
# reutilizável por linguagem (_go, _rust, ...). Nova variante = uma entrada no registro.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: "Plan"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read       # checkout e compare API
      pull-requests: read  # lista os arquivos do PR
    outputs:
      go: ${{ steps.plan.outputs.go }}
      has_go: ${{ steps.plan.outputs.has_go }}
      rust: ${{ steps.plan.outputs.rust }}
      has_rust: ${{ steps.plan.outputs.has_rust }}
      arena: ${{ steps.plan.outputs.arena }}
      docker: ${{ steps.plan.outputs.docker }}
      purity: ${{ steps.plan.outputs.purity }}
      harness: ${{ steps.plan.outputs.harness }}
      arena_go: ${{ steps.registry.outputs.arena_go }}
      arena_rust: ${{ steps.registry.outputs.arena_rust }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/ci-variants.json
            scripts/ci-plan.sh

      - name: Plan pipelines from changed files
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          case "${EVENT_NAME}" in
            pull_request)
              gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename' > changed.txt ;;
            push)
              if [[ "${BEFORE_SHA}" =~ ^0+$ ]]; then
                export CI_FORCE_ALL=true
                : > changed.txt
              else
                gh api "repos/${REPO}/compare/${BEFORE_SHA}...${HEAD_SHA}" --jq '.files[].filename' > changed.txt
              fi ;;
            *)
              export CI_FORCE_ALL=true
              : > changed.txt ;;
          esac
          cat changed.txt
          ./scripts/ci-plan.sh < changed.txt

      - name: Read arena variants
        id: registry
        run: |
          jq -r '. as $r | "arena_go=" + ([$r.variants[] | select(.id == $r.arena.go)][0] | tojson), "arena_rust=" + ([$r.variants[] | select(.id == $r.arena.rust)][0] | tojson)' \
            .github/ci-variants.json >> "${GITHUB_OUTPUT}"

  purity-guard:
    name: "Purity"
    needs: plan
    if: needs.plan.outputs.purity == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_purity.yml

  go:
    name: "Go ${{ matrix.id }}"
    needs: plan
    if: needs.plan.outputs.has_go == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.go) }}
    permissions:
      contents: read
    uses: ./.github/workflows/_go.yml
    with:
      id: ${{ matrix.id }}
      path: ${{ matrix.path }}
      bin_dir: ${{ matrix.bin_dir }}

  rust:
    name: "Rust ${{ matrix.id }}"
    needs: plan
    if: needs.plan.outputs.has_rust == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.rust) }}
    permissions:
      contents: read
    uses: ./.github/workflows/_rust.yml
    with:
      id: ${{ matrix.id }}
      path: ${{ matrix.path }}
      bin_dir: ${{ matrix.bin_dir }}

  docker:
    name: "Docker"
    needs: plan
    if: needs.plan.outputs.docker == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_docker.yml

  harness:
    name: "Harness"
    needs: plan
    if: needs.plan.outputs.harness == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_harness.yml

  arena:
    name: "Arena"
    needs: [plan, go, rust]
    if: needs.plan.outputs.arena == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/_arena.yml
    with:
      go_id: ${{ fromJSON(needs.plan.outputs.arena_go).id }}
      go_bin_dir: ${{ fromJSON(needs.plan.outputs.arena_go).bin_dir }}
      rust_id: ${{ fromJSON(needs.plan.outputs.arena_rust).id }}
      rust_bin_dir: ${{ fromJSON(needs.plan.outputs.arena_rust).bin_dir }}

  # Único check obrigatório: jobs ignorados pelo plano contam como sucesso.
  ci-ok:
    name: "CI OK"
    if: always()
    needs: [plan, purity-guard, go, rust, docker, harness, arena]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if any job failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          case "${RESULTS}" in *failure*|*cancelled*) exit 1;; esac
